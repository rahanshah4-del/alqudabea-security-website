<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ── Primary Meta ────────────────────────────── -->
    <title>ALQUDABEA SECURITY SERVICES W.L.L. — Premium Security Solutions in Bahrain</title>
    <meta
      name="description"
      content="ALQUDABEA SECURITY SERVICES W.L.L. — Bahrain's premier corporate security provider. Licensed by the Ministry of Interior. Manned guarding, CCTV, access control, cybersecurity, and risk assessment."
    />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />

    <!-- ── Favicon & Icons ─────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph Image Placeholder ────────────── -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="ALQUDABEA SECURITY SERVICES W.L.L. — Bahrain's premier security provider" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Open Graph ──────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ALQUDABEA SECURITY SERVICES W.L.L. — Premium Security Solutions in Bahrain"
    />
    <meta
      property="og:description"
      content="Bahrain's premier corporate security provider. Licensed by the Ministry of Interior. Manned guarding, CCTV, access control, cybersecurity, and risk assessment."
    />
    <meta property="og:site_name" content="ALQUDABEA SECURITY SERVICES W.L.L." />
    <meta property="og:locale" content="en_BH" />

    <!-- ── Content Security Policy ──────────────────── -->
    <!--
      Development-compatible CSP via meta tag.
      In production, CSP MUST be served via HTTP headers from Cloudflare.
      The 'unsafe-inline' in script-src is required for Vite dev server
      (React Refresh injects inline scripts). Remove in production headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.clarity.ms https://*.gstatic.com https://static.cloudflareinsights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.clarity.ms https://*.firebaseio.com https://*.firebaseapp.com https://*.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com ws: wss:; frame-src 'self' https://www.google.com https://*.clarity.ms https://*.r2.dev https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- ── DNS Prefetch & Preconnect ───────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://*.clarity.ms" />

    <!-- ── Entry Module ────────────────────────────── -->
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
