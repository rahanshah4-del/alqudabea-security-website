    <linearGradient id="sc" x1="58" y1="74" x2="102" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
