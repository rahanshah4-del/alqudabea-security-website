<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="ALQUDABEA Shield Icon">
  <title>ALQUDABEA Security — Shield Icon</title>

  <defs>
    <linearGradient id="sf" x1="80" y1="14" x2="80" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1628"/>
      <stop offset="1" stop-color="#050D18"/>
    </linearGradient>
    <linearGradient id="ss" x1="80" y1="14" x2="80" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="si" x1="80" y1="26" x2="80" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.04"/>
